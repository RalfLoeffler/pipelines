schema_version: "2.0"
title: ProtocolQC
version: "0.1.0-dev2"
authors:
  - name: Ralf Loeffler
    email: ralf.loeffler@unsw.edu.au
docs:
  description: >-
    Compare DICOM acquisition parameters in an XNAT imaging session against a
    project-specific approved JSON protocol template stored in an XNAT project
    resource folder.
  info_url: https://github.com/RalfLoeffler/pipelines
base_image:
  name: debian
  tag: bookworm-slim
  package_manager: apt
packages:
  pip:
    requests:
    pydicom:
    fileformats:
    fileformats-medimage:
    fileformats-medimage-extras:
    frametree:
    frametree-xnat:
    pydra2app:
    pydra2app-xnat:
    australianimagingservice:
commands:
  protocol-qc:
    operates_on: medimage/session
    task:
      type: python
      function: australianimagingservice.quality_control.protocol_qc:protocol_qc
    parameters:
      ProjectResourceLabel:
        field: project_resource_label
        help: >-
          Label of the project-level XNAT resource folder containing the
          approved protocol JSON file.
        default: ProtocolQC
      ProtocolTemplateFilename:
        field: protocol_template_filename
        help: Filename of the approved protocol JSON inside the project resource.
        default: protocol-template.json
      OutputResource:
        field: output_resource
        help: FrameTree/XNAT derivative resource path for the JSON report.
        default: ProtocolQC@protocol-qc
      FailOnDeviation:
        field: fail_on_deviation
        help: Fail the container after writing a report containing deviations.
        default: false
      DryRun:
        field: dry_run
        help: Generate and log the report without writing it back to XNAT.
        default: true

