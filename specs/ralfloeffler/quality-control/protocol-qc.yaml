schema_version: "2.0"
title: ProtocolQC
version: "0.1.0-dev1"
authors:
  - name: Ralf Loeffler
    email: ""
docs:
  description: >-
    Compare DICOM acquisition parameters in an XNAT imaging session against an
    approved JSON protocol template packaged in the container image.
  info_url: https://github.com/RalfLoeffler/pipelines
base_image:
  name: debian
  tag: bookworm-slim
  package_manager: apt
packages:
  pip:
    pydicom:
    fileformats:
    fileformats-medimage:
    fileformats-medimage-extras:
    frametree:
    frametree-xnat:
    pydra2app:
    pydra2app-xnat:
    australianimagingservice:
commands:
  protocol-qc:
    operates_on: medimage/session
    task:
      type: python
      function: australianimagingservice.quality_control.protocol_qc:protocol_qc
    parameters:
      ProtocolTemplate:
        field: protocol_template
        help: Absolute path to the approved protocol JSON file in the image.
        default: /opt/protocol-qc-template/protocol-template.json
      OutputResource:
        field: output_resource
        help: FrameTree/XNAT derivative resource path for the JSON report.
        default: ProtocolQC@protocol-qc
      FailOnDeviation:
        field: fail_on_deviation
        help: Fail the container after writing a report that contains deviations.
        default: false
      DryRun:
        field: dry_run
        help: Generate and log the report without writing it back to XNAT.
        default: true
    resources:
      protocol-qc-template: /opt/protocol-qc-template
